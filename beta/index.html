<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>每日運動紀錄</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f7f7f5; --card:#ffffff; --card2:#f1f1ee; --line:rgba(11,11,11,.10);
  --ink:#111113; --ink2:#55555c; --mut:#8a8a90;
  --acc:#0b7f9f; --acc-ink:#ffffff; --acc-soft:rgba(11,127,159,.12);
  --good:#0ca30c; --warn:#d98b00; --crit:#d03b3b;
  --bar:#0b7f9f; --bar-dim:#dcdcd7;
  --r:14px; --r2:10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --serif: ui-serif, "Noto Serif TC", "Songti TC", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --card:#18181a; --card2:#232326; --line:rgba(255,255,255,.09);
    --ink:#ffffff; --ink2:#c9c9cf; --mut:#85858c;
    --acc:#19a3c9; --acc-ink:#04202a; --acc-soft:rgba(25,163,201,.16);
    --bar:#19a3c9; --bar-dim:#2a2a2d;
    --good:#2fbf2f; --warn:#f0b429; --crit:#e26060;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --card:#18181a; --card2:#232326; --line:rgba(255,255,255,.09);
  --ink:#ffffff; --ink2:#c9c9cf; --mut:#85858c;
  --acc:#19a3c9; --acc-ink:#04202a; --acc-soft:rgba(25,163,201,.16);
  --bar:#19a3c9; --bar-dim:#2a2a2d;
  --good:#2fbf2f; --warn:#f0b429; --crit:#e26060;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
.shell{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(92px + var(--safe-b))}
.shell.padopen{padding-bottom:calc(340px + var(--safe-b))}
/* 頂列 */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
.topbar .d{font-size:13px;color:var(--mut);letter-spacing:.02em}
.topbar .sp{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--acc-ink);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--mut);flex:none}
.sync-dot[data-s="saving"]{background:var(--warn);animation:pls 1s infinite}
.sync-dot[data-s="ok"]{background:var(--good)}
.sync-dot[data-s="err"]{background:var(--crit)}
@keyframes pls{50%{opacity:.3}}
/* 版面元件 */
main{padding:0 18px}
.lab{font-size:12px;color:var(--mut);letter-spacing:.06em;margin:22px 0 8px}
.lab:first-child{margin-top:8px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big .n{font-size:44px;font-weight:650;letter-spacing:-.02em;line-height:1}
.big .u{font-size:13px;color:var(--mut);margin-left:-8px}
.sub{font-size:13px;color:var(--mut);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rowcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:block;width:100%;text-align:left}
a.rowcard{text-decoration:none;color:var(--ink)}
.rowcard .t{display:flex;align-items:baseline;gap:8px}
.rowcard .t b{font-size:15px;font-weight:650}
.rowcard .t .tag{font-size:11.5px;color:var(--mut)}
.rowcard .t .dt{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.rowcard .m{font-size:13px;color:var(--ink2);margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--ink2);background:var(--card)}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft);font-weight:600}
.btn{border:1px solid var(--line);border-radius:var(--r2);padding:9px 14px;font-size:14px;background:var(--card)}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--acc-ink);font-weight:650}
.btn.ghost{background:transparent}
.btn.dim{color:var(--mut)}
.btn.crit,.crit{color:var(--crit)}
.btn.wide{width:100%;text-align:center;padding:13px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.link{color:var(--acc);font-size:13px;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.empty span{font-size:13px;color:var(--mut);display:block;line-height:1.7}
.note{background:var(--card);border-left:3px solid var(--acc);border-radius:var(--r2);padding:12px 14px;margin-bottom:14px}
.note b{display:block;font-size:14px;color:var(--acc);margin-bottom:3px}
.note span{font-size:13px;color:var(--ink2)}
/* 週長條 */
.week{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:4px}
.week .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;border-radius:4px 4px 0 0;background:var(--bar);min-height:3px}
.week .b.z{background:var(--bar-dim);height:5px}
.week .k{font-size:11px;color:var(--mut)}
/* 分頁列 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:10px 18px calc(10px + var(--safe-b));display:flex;align-items:center;max-width:520px;margin:0 auto}
.tabbar button[data-tab]{flex:1;font-size:11px;color:var(--mut);padding:4px 0;display:flex;flex-direction:column;
  align-items:center;gap:3px}
.tabbar button[data-tab] svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--acc);font-weight:650}
.tabbar button[aria-selected="true"] svg{stroke-width:2.1}
.fab{width:54px;height:54px;border-radius:50%;background:var(--acc);color:var(--acc-ink);
  font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 6px 18px rgba(0,0,0,.22);margin-top:-26px}
/* 底部抽屜 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-width:520px;margin:0 auto;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.3,.8,.4,1);max-height:88dvh;overflow:auto}
.sheet.on{transform:translateY(0)}
.sheet h2{font-size:19px;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
.sheet h2 .r{margin-left:auto;font-size:12px;color:var(--mut);font-weight:400}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 button{border:1px solid var(--line);border-radius:var(--r2);padding:13px 6px;font-size:13.5px;background:var(--card2)}
.grid3 button[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--acc-ink);font-weight:650}
/* 紀錄表單 */
.formhead h1{font-size:28px;margin:6px 0 2px;letter-spacing:-.01em}
.formhead .meta{font-size:13px;color:var(--mut)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r2);padding:12px 13px;font-size:16px}
.field textarea{min-height:76px;resize:vertical;font-size:15px}
.field input[readonly]{color:var(--mut)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r2);padding:12px 14px;margin-bottom:8px}
.bigrow .k{font-size:13px;color:var(--mut);width:68px;flex:none}
.bigrow .v{font-size:24px;font-weight:650;letter-spacing:-.01em;flex:1;border:0;background:none;padding:0;width:100%}
.bigrow .u{font-size:12px;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border:1px solid var(--line);border-radius:var(--r2);font-size:20px;background:var(--card2)}
.stepper .v{font-size:26px;font-weight:650;min-width:58px;text-align:center}
/* 重訓動作卡 */
.exc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.exc .h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.exc .h b{font-size:16px;font-weight:650}
.exc .h .tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.exc .h .tut{margin-left:auto;font-size:12.5px;color:var(--acc);font-weight:600;white-space:nowrap}
.exc .cue{font-size:12.5px;color:var(--mut);padding:0 14px 8px}
.set{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line)}
.set .no{font-size:11px;color:var(--mut);width:14px;flex:none}
.set .w,.set .r{font-size:22px;font-weight:650;letter-spacing:-.01em;min-width:44px;text-align:right;
  border-radius:6px;padding:1px 4px}
.set .w.sel,.set .r.sel{background:var(--acc-soft);color:var(--acc)}
.set .x{font-size:12px;color:var(--mut)}
.set .last{margin-left:auto;font-size:11px;color:var(--mut);text-align:right;line-height:1.35}
.set .ok{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);font-size:14px;color:var(--mut);flex:none;
  display:flex;align-items:center;justify-content:center}
.set .ok[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
.exc .f{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.exc .f .vol{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.exc.fold .h{padding-bottom:12px}
.exc.fold .sum{margin-left:auto;font-size:12px;color:var(--mut)}
/* 數字鍵盤 */
.pad{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + var(--safe-b));max-width:520px;margin:0 auto;transform:translateY(110%);
  transition:transform .2s cubic-bezier(.3,.8,.4,1)}
.pad.on{transform:translateY(0)}
.pad .st{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);padding:2px 4px 8px}
.pad .st b{color:var(--ink);font-weight:600}
.pad .st .rest{margin-left:auto}
.pad .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pad .keys button{border:1px solid var(--line);border-radius:var(--r2);padding:14px 0;font-size:20px;font-weight:600;background:var(--card2)}
.pad .keys button.alt{font-size:14px;font-weight:600;color:var(--ink2);background:var(--card)}
.pad .keys button.go{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
/* 統計 */
.kpis{display:flex;gap:22px;align-items:baseline;margin:2px 0 4px}
.kpis div{display:flex;flex-direction:column}
.kpis .n{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.05}
.kpis .n.acc{color:var(--acc)}
.kpis .k{font-size:11.5px;color:var(--mut);margin-top:4px}
.trend{display:flex;align-items:flex-end;gap:4px;height:104px}
.trend .b{flex:1;background:var(--bar-dim);border-radius:3px 3px 0 0;min-height:3px}
.trend .b.hot{background:var(--bar)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.hbar .k{font-size:12.5px;color:var(--ink2);width:76px;flex:none;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .t{flex:1;height:9px;border-radius:5px;background:var(--bar-dim);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;background:var(--bar)}
.hbar .t i.dim{background:var(--mut);opacity:.55}
.hbar .v{font-size:12px;color:var(--mut);width:52px;font-variant-numeric:tabular-nums}
.prrow{display:flex;align-items:baseline;gap:8px;padding:11px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.prrow .nm{font-size:14px}
.prrow .v{margin-left:auto;font-size:19px;font-weight:650}
.prrow .u{font-size:11.5px;color:var(--mut)}
/* 教學 */
.tut-h .part{font-size:12px;color:var(--mut);letter-spacing:.06em}
.tut-h h1{font-size:26px;margin:4px 0 2px}
.tut-h .en{font-size:13px;color:var(--mut)}
.mus{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mus .zh{font-size:14px}
.mus .en{font-size:11.5px;color:var(--mut)}
.mus .pri{margin-left:auto;font-size:11px;color:var(--acc);font-weight:600}
.step{display:flex;gap:11px;padding:8px 0}
.step .n{width:21px;height:21px;border-radius:50%;background:var(--acc-soft);color:var(--acc);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.step .t{font-size:14px;color:var(--ink2)}
.bul{font-size:13.5px;color:var(--ink2);padding:4px 0 4px 14px;position:relative}
.bul:before{content:"·";position:absolute;left:2px;color:var(--mut)}
.risk{background:var(--card2);border-radius:var(--r2);padding:11px 13px;font-size:13px;color:var(--ink2);margin-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pgrid button{border:1px solid var(--line);border-radius:var(--r2);padding:12px 4px;background:var(--card);text-align:center}
.pgrid button b{display:block;font-size:14px}
.pgrid button span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.pgrid button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
/* 登入 */
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  padding:0 24px calc(26px + var(--safe-b));overflow:auto}
.gate[hidden]{display:none}
.gate .in{max-width:460px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;padding-top:16vh}
.gate .yr{font-size:12px;color:var(--mut);letter-spacing:.2em;margin-bottom:14px}
.gate h1{font-family:var(--serif);font-size:42px;line-height:1.18;margin:0 0 18px;font-weight:500;letter-spacing:.01em}
.gate p{font-size:14.5px;color:var(--ink2);margin:0 0 22px;line-height:1.65}
.gate ul{list-style:none;padding:0;margin:0 0 auto;font-size:13.5px;color:var(--mut);line-height:1.9}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:15px;font-size:15.5px;font-weight:650;margin-top:28px}
.gbtn svg{width:19px;height:19px;background:#fff;border-radius:3px;padding:1px}
.gate .fine{font-size:11.5px;color:var(--mut);margin-top:14px;line-height:1.7}
.setup{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);margin-top:20px}
.setup b{display:block;font-size:13.5px;margin-bottom:8px}
.setup ol{margin:0 0 10px;padding-left:18px;font-size:12.5px;color:var(--ink2);line-height:1.8}
.setup code{background:var(--card2);border-radius:4px;padding:1px 5px;font-size:11.5px;word-break:break-all}
/* beta 標示 */
.betabar{background:var(--warn);color:#1a1200;font-size:12px;font-weight:650;text-align:center;padding:5px 10px;
  letter-spacing:.04em}
/* M2：分段控制、時間輸入、HYROX、間歇、賽事、週報 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);gap:2px}
.seg button{padding:7px 16px;border-radius:999px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);font-weight:650}
.stepper .u{font-size:12px;color:var(--mut);margin-left:-4px}
.tin,.nin{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 8px;font-size:16px;
  font-variant-numeric:tabular-nums;text-align:right;width:76px;min-width:0}
.field .tin{width:100%;text-align:left;padding:12px 13px}
.tin.big{font-size:19px;font-weight:650;width:96px}
.nin{width:64px}
.tin:focus,.nin:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
/* 提示文字要淡，避免看起來像已經填好的數值 */
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.5;font-weight:400}
.rp-sub{display:flex;margin:10px 0 0}
.hxdiv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.hxw{font-size:12.5px;color:var(--ink2);background:var(--card2);border-radius:8px;padding:8px 10px;margin:6px 0 4px}
.hxtot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:16px 0 8px}
.hxbig{font-size:40px;font-weight:650;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.hxsum{font-size:12px;color:var(--mut);text-align:right;line-height:1.7;font-variant-numeric:tabular-nums}
.hxtbl{border-top:1px solid var(--line)}
.hxr{display:grid;grid-template-columns:16px 34px 74px 1fr 74px;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--line)}
.hxr .no{font-size:11px;color:var(--mut)}
.hxr .lb{font-size:12.5px;color:var(--ink2)}
.hxr .lb.st{padding-left:4px}
.hxr .tin{width:100%;padding:7px 6px}
.hxh span{font-size:11px;color:var(--mut)}
.hxrox{grid-template-columns:16px 1fr 74px}
.hxcombo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
.hxcombo .k{font-size:12.5px;color:var(--mut)}
.hxset{gap:6px;flex-wrap:wrap}
.hxset .x{font-size:12px;color:var(--mut)}
.hxset .ok{margin-left:auto}
.hiitg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hiitg .stepper{gap:6px}
.hiitg .stepper button{width:32px;height:34px;font-size:17px}
.hiitg .stepper .v{font-size:20px;min-width:36px}
.mvrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mvrow .mvt{flex:1;min-width:110px}
.mvrow .mvt b{display:block;font-size:15px;font-weight:600}
.mvrow .mvsub{font-size:12px;color:var(--mut)}
.mvrow .x{font-size:12px;color:var(--mut)}
.mvrow .tut{font-size:12.5px;color:var(--acc);font-weight:600}
.mvrow .ok{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.race{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.race.mine{border-left:3px solid var(--acc)}
.race.past{opacity:.6}
.race .rd{display:flex;flex-direction:column;align-items:center;min-width:38px}
.race .rd .m{font-size:11px;color:var(--mut)}
.race .rd .d{font-size:24px;font-weight:650;line-height:1.1}
.race .ri{flex:1;min-width:0}
.race .ri b{display:block;font-size:15px}
.race .ri .m{font-size:12.5px;color:var(--mut);margin-top:1px}

<script>
"use strict";
/* ============================================================
   狀態 · 儲存 · 導覽
   ============================================================ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function el(t,a,x){const n=document.createElement(t);
  if(a) for(const k in a){ if(k==="class")n.className=a[k]; else if(k==="html")n.innerHTML=a[k]; else if(a[k]!=null)n.setAttribute(k,a[k]); }
  if(x!=null)n.textContent=x; return n;}
const pad2=n=>String(n).padStart(2,"0");
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const fmt=n=>(Math.round(n*10)/10).toLocaleString("zh-TW");
const dstr=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const today=()=>dstr(new Date());
const WD=["日","一","二","三","四","五","六"];
function mdw(s){ const d=new Date(s+"T00:00:00"); return (d.getMonth()+1)+"月"+d.getDate()+"日 週"+WD[d.getDay()]; }
function md(s){ const d=new Date(s+"T00:00:00"); return (d.getMonth()+1)+"/"+d.getDate(); }
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200);}
function paceStr(mpu){ if(!isFinite(mpu)||mpu<=0) return ""; const m=Math.floor(mpu),s=Math.round((mpu-m)*60);
  return s===60?(m+1)+"'00\"":m+"'"+pad2(s)+"\""; }
function mmss(sec){ const m=Math.floor(sec/60),s=sec%60; return m+":"+pad2(s); }

const KEY = APP.beta ? "fitnessRecord.beta" : "fitnessRecord.v1";
let storageOK=true, cacheKey=KEY;
let DB=null, view="home", L=null;

/* 課表以「名稱」為識別，去掉同名重複（舊版 id 與新版 id 不同造成的） */
function dedupeTemplates(list){
  const seen=new Set(), keep=[];
  (Array.isArray(list)?list:[]).forEach(t=>{
    if(!t) return;
    const k=String(t.name||t.id||"").trim();
    if(!k||seen.has(k)) return;
    seen.add(k); keep.push(t);
  });
  return keep;
}
function normalize(d){
  d=d||{}; d.version=2;
  d.entries=Array.isArray(d.entries)?d.entries:[];
  d.templates=Array.isArray(d.templates)&&d.templates.length?d.templates:TEMPLATES_DEFAULT.map(t=>({...t}));
  d.templates=dedupeTemplates(d.templates);
  // 預設模板升版：把新增的快選項目補進既有清單（只做一次）
  if((d.tplSeed||0)<TPL_SEED){
    const have=new Set();
    d.templates.forEach(t=>{ if(t.id) have.add(t.id); if(t.name) have.add(t.name); });
    TEMPLATES_DEFAULT.forEach(t=>{ if(!have.has(t.id)&&!have.has(t.name)) d.templates.push({...t}); });
    d.tplSeed=TPL_SEED;
  }
  d.customExercises=d.customExercises||{};
  d.deleted=d.deleted||{};
  d.races=Array.isArray(d.races)?d.races.filter(r=>r&&r.id&&!d.deleted[r.id]):[];
  d.draft=d.draft||null;
  d.theme=d.theme||"system";
  d.updatedAt=d.updatedAt||0;
  return d;
}
function load(){
  try{ const raw=localStorage.getItem(cacheKey); DB=normalize(raw?JSON.parse(raw):{});
       localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe");
  }catch(e){ storageOK=false; DB=normalize({}); }
}
function save(opt){
  DB.updatedAt=Date.now();
  if(storageOK){ try{ localStorage.setItem(cacheKey, JSON.stringify(DB)); }catch(e){ storageOK=false; } }
  if(!(opt&&opt.noCloud)) Cloud.schedulePush();
}
function applyTheme(){
  const t=(DB&&DB.theme)||"system";
  if(t==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}

/* 導覽 */
const VIEWS=["home","stats","history","log","tut","tutd","me","races"];
function go(v,opt){
  view=v;
  VIEWS.forEach(x=> $("#v-"+x).hidden = x!==v);
  $$("#tabbar button[data-tab]").forEach(b=> b.setAttribute("aria-selected", String(b.dataset.tab===v)));
  $("#tabbar").hidden = (v==="log");
  closePad();
  if(v==="home") renderHome();
  if(v==="stats") renderStats(opt);
  if(v==="races") renderRaces();
  if(v==="history") renderHistory();
  if(v==="tut") renderTutList();
  if(v==="me") renderMe();
  window.scrollTo(0,0);
}
$$("#tabbar button[data-tab]").forEach(b=> b.addEventListener("click",()=>{
  if(L && view==="log" && !confirm("離開會保留草稿，確定離開？")) return;
  if(L && view==="log") stashDraft();
  go(b.dataset.tab);
}));
$("#btn-me").addEventListener("click",()=>go("me"));
$("#btn-add").addEventListener("click",openAddSheet);

/* 抽屜 */
function openSheet(build){
  const s=$("#sheet"), sc=$("#scrim");
  s.innerHTML=""; build(s);
  sc.hidden=false; s.hidden=false;
  requestAnimationFrame(()=>{ sc.classList.add("on"); s.classList.add("on"); });
}
function closeSheet(){
  const s=$("#sheet"), sc=$("#scrim");
  s.classList.remove("on"); sc.classList.remove("on");
  setTimeout(()=>{ s.hidden=true; sc.hidden=true; },200);
}
$("#scrim").addEventListener("click",closeSheet);

/* ============================================================
   首頁
   ============================================================ */
function weekStart(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function entryVolume(e){
  if(e.sport!=="strength") return 0;
  return ((e.data&&e.data.exercises)||[]).reduce((a,x)=>a+x.sets.reduce((b,s)=>b+num(s.w)*num(s.reps),0),0);
}
function streak(){
  const set=new Set(DB.entries.map(e=>e.date));
  let n=0,d=new Date();
  if(!set.has(dstr(d))) d.setDate(d.getDate()-1);
  while(set.has(dstr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function describe(e){
  const d=e.data||{};
  const ext=describeExt(e);           // HYROX / 間歇 / 混合健身（M2）
  if(ext!=null) return ext;
  switch(e.sport){
    case "strength":{
      const parts=[...new Set((d.exercises||[]).map(x=>PARTS[x.part]?PARTS[x.part].n:"")).values()].filter(Boolean);
      const sets=(d.exercises||[]).reduce((a,x)=>a+x.sets.length,0);
      return [parts.join(" · "), sets+" 組", fmt(entryVolume(e))+" kg·次", e.duration?e.duration+" 分":"", e.rpe?"RPE "+e.rpe:""].filter(Boolean).join(" · ");}
    case "run": return [d.dist?d.dist+" km":"", (e.duration&&d.dist)?paceStr(e.duration/d.dist)+" /km":"", d.hr?"心率 "+d.hr:"", d.place||""].filter(Boolean).join(" · ");
    case "bike": return [d.dist?d.dist+" km":"", (e.duration&&d.dist)?fmt(d.dist/(e.duration/60))+" km/h":"", d.gain?"爬升 "+d.gain+" m":"", d.power?d.power+" W":""].filter(Boolean).join(" · ");
    case "swim": return [d.dist?d.dist+" m":"", d.stroke||"", (e.duration&&d.dist)?paceStr(e.duration/(d.dist/100))+" /100m":""].filter(Boolean).join(" · ");
    case "climb": return [d.place||"", d.dist?d.dist+" km":"", d.gain?"爬升 "+d.gain+" m":"", e.duration?e.duration+" 分":""].filter(Boolean).join(" · ");
    case "hike": return [d.place||"", d.dist?d.dist+" km":"", d.gain?"爬升 "+d.gain+" m":""].filter(Boolean).join(" · ");
    case "hiit": return [d.name||"", d.rounds?d.rounds+" 回合":"", (d.work&&d.rest)?d.work+"″/"+d.rest+"″":"", d.hr?"心率 "+d.hr:""].filter(Boolean).join(" · ");
    case "crossfit": return [d.name||"", d.type||"", d.result||"", d.scale||""].filter(Boolean).join(" · ");
    case "badminton": return [d.type||"", d.games?d.games+" 局":"", d.place||""].filter(Boolean).join(" · ");
  }
  return e.duration?e.duration+" 分":"";
}
function renderHome(){
  const v=$("#v-home"); v.innerHTML="";
  const ws=dstr(weekStart(new Date()));
  const wk=DB.entries.filter(e=>e.date>=ws);
  const mins=wk.reduce((a,e)=>a+num(e.duration),0);
  const vol=wk.reduce((a,e)=>a+entryVolume(e),0);

  v.appendChild(el("div",{class:"lab"},"本週"));
  const big=el("div",{class:"big"});
  big.appendChild(el("span",{class:"n"},String(wk.length)));
  big.appendChild(el("span",{class:"u"},"次"));
  big.appendChild(el("span",{class:"n"},fmt(mins/60)));
  big.appendChild(el("span",{class:"u"},"小時"));
  v.appendChild(big);
  v.appendChild(el("div",{class:"sub"},
    (vol?"訓練量 "+fmt(vol)+" kg·次　":"")+"連續 "+streak()+" 天"));

  homeCards(v);                       // 週報摘要、下一場賽事（M2）

  // 本週每日時長
  v.appendChild(el("div",{class:"lab"},"本週每日時間（分鐘）"));
  const wrap=el("div",{class:"week"});
  const days=[];
  for(let i=0;i<7;i++){ const d=new Date(weekStart(new Date())); d.setDate(d.getDate()+i);
    const ds=dstr(d); days.push({k:WD[d.getDay()], v:DB.entries.filter(e=>e.date===ds).reduce((a,e)=>a+num(e.duration),0)}); }
  const mx=Math.max(...days.map(d=>d.v),1);
  days.forEach(d=>{
    const c=el("div",{class:"c"});
    const b=el("div",{class:"b"+(d.v?"":" z")});
    if(d.v) b.style.height=Math.max(6,Math.round(d.v/mx*76))+"px";
    b.title=d.v+" 分鐘";
    c.appendChild(b); c.appendChild(el("div",{class:"k"},d.k)); wrap.appendChild(c);
  });
  v.appendChild(wrap);

  // 最近紀錄
  const head=el("div",{class:"lab",style:"display:flex;align-items:center"});
  head.appendChild(el("span",null,"最近紀錄"));
  const all=el("button",{class:"link",style:"margin-left:auto"},"全部");
  all.addEventListener("click",()=>go("history"));
  head.appendChild(all);
  v.appendChild(head);

  const recent=DB.entries.slice().sort((a,b)=> b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,4);
  if(!recent.length){
    const e=el("div",{class:"empty"});
    e.appendChild(el("b",null,"還沒有紀錄"));
    e.appendChild(el("span",null,"按下方的 ＋ 選一種運動開始"));
    e.appendChild(el("span",null,"事後補記錄也可以改日期"));
    v.appendChild(e);
  } else recent.forEach(e=> v.appendChild(entryRow(e)));

  if(DB.draft){
    const d=el("div",{class:"sub",style:"margin-top:16px;display:flex;align-items:center;gap:8px"});
    d.appendChild(el("span",null,"有一筆未完成的"+(SPORTS[DB.draft.sport]?SPORTS[DB.draft.sport].n:"")+"草稿"));
    const b=el("button",{class:"link"},"繼續");
    b.addEventListener("click",()=>{ L=DB.draft; openLog(); });
    d.appendChild(b);
    const x=el("button",{class:"btn sm dim"},"丟棄");
    x.addEventListener("click",()=>{ if(confirm("丟棄草稿？")){ DB.draft=null; save(); renderHome(); } });
    d.appendChild(x);
    v.appendChild(d);
  }
}
function entryRow(e){
  const c=el("button",{class:"rowcard"});
  const t=el("div",{class:"t"});
  t.appendChild(el("b",null,SPORTS[e.sport]?SPORTS[e.sport].n:e.sport));
  const sub=e.sport==="strength"
    ? [...new Set(((e.data&&e.data.exercises)||[]).map(x=>PARTS[x.part]?PARTS[x.part].n:""))].filter(Boolean).join(" · ")
    : e.sport==="hyrox" ? ((e.data&&e.data.mode)==="station"?"站點訓練":"模擬賽")
    : ((e.data&&(e.data.place||e.data.name))||"");
  if(sub) t.appendChild(el("span",{class:"tag"},sub));
  t.appendChild(el("span",{class:"dt"},md(e.date)));
  c.appendChild(t);
  c.appendChild(el("div",{class:"m"},describe(e)));
  c.addEventListener("click",()=>openEntrySheet(e));
  return c;
}
function openEntrySheet(e){
  openSheet(s=>{
    const h=el("h2",null,SPORTS[e.sport].n);
    h.appendChild(el("span",{class:"r"},mdw(e.date)));
    s.appendChild(h);
    s.appendChild(el("p",{style:"font-size:13.5px;color:var(--ink2);margin:6px 0 14px"},describe(e)));
    if(e.note) s.appendChild(el("p",{style:"font-size:13px;color:var(--mut);margin:0 0 14px"},"📝 "+e.note));
    if(e.sport==="strength"){
      ((e.data&&e.data.exercises)||[]).forEach(x=>{
        s.appendChild(el("div",{style:"font-weight:650;margin-top:10px"},x.name));
        s.appendChild(el("div",{style:"font-size:13px;color:var(--ink2)"},
          x.sets.map((st,i)=>(i+1)+". "+st.w+" kg × "+st.reps).join("　")));
      });
    }
    const row=el("div",{class:"chips",style:"margin-top:18px"});
    const del=el("button",{class:"btn crit"},"刪除這筆");
    del.addEventListener("click",()=>{
      if(!confirm("刪除 "+e.date+" 的"+SPORTS[e.sport].n+"紀錄？")) return;
      DB.entries=DB.entries.filter(x=>x.id!==e.id); DB.deleted[e.id]=Date.now(); save();
      closeSheet(); go(view);
    });
    const cl=el("button",{class:"btn"},"關閉");
    cl.addEventListener("click",closeSheet);
    row.appendChild(del); row.appendChild(cl);
    s.appendChild(row);
  });
}

/* ============================================================
   ＋ 選擇單
   ============================================================ */
function recentExercises(n){
  const out=[], seen=new Set();
  DB.entries.filter(e=>e.sport==="strength")
    .sort((a,b)=>b.date.localeCompare(a.date))
    .forEach(e=> ((e.data&&e.data.exercises)||[]).forEach(x=>{
      if(seen.has(x.name)) return; seen.add(x.name);
      const last=x.sets[x.sets.length-1];
      out.push({name:x.name, part:x.part, date:e.date, last: last? last.w+"×"+last.reps : ""});
    }));
  return out.slice(0,n||4);
}
function openAddSheet(){
  openSheet(s=>{
    let date=today();
    const h=el("h2",null,"記一筆");
    const r=el("span",{class:"r"},md(date)+" · 可改日期");
    h.appendChild(r); s.appendChild(h);

    const dr=el("div",{class:"field",style:"margin:12px 0 4px"});
    const di=el("input",{type:"date",value:date});
    di.addEventListener("change",()=>{ date=di.value||today(); r.textContent=md(date)+" · 可改日期"; });
    dr.appendChild(di); s.appendChild(dr);

    const tpl=DB.templates||[];
    if(tpl.length){
      s.appendChild(el("div",{class:"lab"},"從課表模板"));
      const c=el("div",{class:"chips"});
      tpl.forEach(t=>{
        const b=el("button",{class:"chip"},t.name);
        b.addEventListener("click",()=>{ closeSheet(); startStrength(date, t); });
        c.appendChild(b);
      });
      const last=DB.entries.filter(e=>e.sport==="strength").sort((a,b)=>b.date.localeCompare(a.date))[0];
      if(last){
        const b=el("button",{class:"chip"},"重複上次");
        b.addEventListener("click",()=>{ closeSheet(); repeatLast(date,last); });
        c.appendChild(b);
      }
      s.appendChild(c);
    }

    const rec=recentExercises(4);
    if(rec.length){
      s.appendChild(el("div",{class:"lab"},"最近常用"));
      rec.forEach(x=>{
        const b=el("button",{class:"rowcard"});
        const t=el("div",{class:"t"});
        t.appendChild(el("b",null,x.name));
        t.appendChild(el("span",{class:"tag"},PARTS[x.part]?PARTS[x.part].n:""));
        t.appendChild(el("span",{class:"dt"},"上次 "+x.last+" · "+md(x.date)));
        b.appendChild(t);
        b.addEventListener("click",()=>{ closeSheet(); startStrength(date,null,[x.name]); });
        s.appendChild(b);
      });
    }

    s.appendChild(el("div",{class:"lab"},"選擇運動"));
    const g=el("div",{class:"grid3"});
    SPORT_KEYS.forEach(k=>{

/* ============================================================
   紀錄編輯
   ============================================================ */
function blankLog(sport,date){
  return {sport, date:date||today(), duration:"", rpe:"", note:"", template:"", exercises:[], data:{}};
}
function startStrength(date, tpl, names){
  L=blankLog("strength",date);
  if(tpl){ L.template=tpl.name; (tpl.items||[]).forEach(n=>addExercise(n,true)); }
  if(names) names.forEach(n=>addExercise(n,true));
  openLog();
}
function repeatLast(date,last){
  L=blankLog("strength",date);
  L.template=(last.data&&last.data.template)||"";
  ((last.data&&last.data.exercises)||[]).forEach(x=>{
    L.exercises.push({name:x.name, part:x.part, sets:x.sets.map(s=>({w:s.w,reps:s.reps,done:false,t:true}))});
  });
  openLog(); toast("已帶入上次的動作與重量");
}
function startSport(k,date){ L=blankLog(k,date); openLog(); }
function openLog(){ go("log"); renderLog(); }
function stashDraft(){
  if(!L) return;
  const worth = logHasContent(L);
  DB.draft = worth ? L : null;
  save({noCloud:!DB.draft});
  L=null;
}
function lastSetsFor(name){
  const list=DB.entries.filter(e=>e.sport==="strength").sort((a,b)=>b.date.localeCompare(a.date));
  for(const e of list){ const x=((e.data&&e.data.exercises)||[]).find(y=>y.name===name); if(x&&x.sets.length) return {sets:x.sets,date:e.date}; }
  return null;
}
function addExercise(name, quiet){
  const info=exInfo(name);
  const prev=lastSetsFor(name);
  // t = 使用者真的動過這一組（系統帶入的上次重量不算）
  const sets = prev ? prev.sets.map(s=>({w:s.w,reps:"",done:false,t:false}))
                    : [{w:"",reps:"",done:false,t:false},{w:"",reps:"",done:false,t:false},{w:"",reps:"",done:false,t:false}];
  L.exercises.push({name, part: info?info.part:(exPart(name)||"full"), sets});
  if(!quiet){ renderLog(); toast("已加入 "+name); }
}
function exVol(x){ return x.sets.reduce((a,s)=>a+num(s.w)*num(s.reps),0); }

function renderLog(){
  const v=$("#v-log"); v.innerHTML="";
  if(!L) return;
  const sp=SPORTS[L.sport];

  });
  const pick=el("button",{class:"chip"},"改日期");
  pick.addEventListener("click",()=>{
    const d=prompt("日期（YYYY-MM-DD）",L.date); if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)){ L.date=d; renderLog(); }
  });
  dates.appendChild(pick);
  v.appendChild(dates);

  const hd=el("div",{class:"formhead"});
  const h1=el("h1",null,sp.n);
  hd.appendChild(h1);
  hd.appendChild(el("div",{class:"meta"}, mdw(L.date)));

  if(L.sport==="strength") renderStrengthBody(v);

  g.appendChild(fieldInput("RPE 1–10","number",L.rpe,x=>L.rpe=x,"7"));

  nf.appendChild(el("label",null,"備註 / 身體感受"));

  ta.addEventListener("input",()=>L.note=ta.value);
  nf.appendChild(ta); v.appendChild(nf);

  const foot=el("div",{style:"display:flex;gap:10px;margin:18px 0 10px"});

  cancel.addEventListener("click",confirmLeave);
  const ok=el("button",{class:"btn pri",id:"btn-save-log",style:"flex:1;padding:13px"},"儲存這筆紀錄");

/* 離開未儲存的紀錄：保留草稿 / 捨棄 / 繼續編輯 */
function confirmLeave(){
  if(!L){ go("home"); return; }
  closePad();

      b.addEventListener("click",()=>{ closeSheet(); fn(); });
      return b;
    };
    s.appendChild(mk("繼續編輯","回到剛才的畫面","",()=>{ go("log"); renderLog(); }));

function fieldInput(label,type,val,on,ph,attrs){

  f.appendChild(el("label",null,label));

}
function fieldSelect(label,opts,val,on){

  f.appendChild(s); return f;
}

/* 重訓主體 */

    [mdw(L.date), parts.join(" · "), L.exercises.length?L.exercises.length+" 動作":"", sets?sets+" 組":"",
     vol?"訓練量 "+fmt(vol)+" kg·次":""].filter(Boolean).join(" · ");

/* 快選課表切換：使用者真的輸入過才需要先問過 */
function hasInput(){
  return !!(L && L.sport==="strength" && L.exercises.some(x=>x.sets.some(s=> s.t || s.reps!=="" )));
}
function setTemplate(t){
  L.template=t.name;
  L.exercises=[];
  (t.items||[]).forEach(n=>addExercise(n,true));
  KP.ex=-1; closePad(); renderLog();
  toast("已套用「"+t.name+"」");
}
function applyTemplate(t){
  if(!L) return;
  if(L.template===t.name) return;
  if(!hasInput()){ setTemplate(t); return; }
  closePad();
  openSheet(s=>{
    const h=el("h2",null,"已經輸入資料");
    s.appendChild(h);
    s.appendChild(el("p",{style:"font-size:13.5px;color:var(--ink2);margin:8px 0 16px"},
      "目前的「"+(L.template||"自訂菜單")+"」已經填了重量或次數。要怎麼處理？"));
    const mk=(label,desc,cls,fn)=>{
      const b=el("button",{class:"rowcard"});
      const r=el("div",{class:"t"}); r.appendChild(el("b",{class:cls||""},label));
      b.appendChild(r); b.appendChild(el("div",{class:"m"},desc));
      b.addEventListener("click",()=>{ closeSheet(); fn(); });
      return b;
    };
    s.appendChild(mk("留在「"+(L.template||"目前菜單")+"」","不切換，繼續記現在這份（建議）","",()=>renderLog()));
    s.appendChild(mk("把「"+t.name+"」的動作加進來","保留已輸入的內容，只補上缺少的動作","",()=>{
      (t.items||[]).forEach(n=>{ if(!L.exercises.some(y=>y.name===n)) addExercise(n,true); });
      renderLog(); toast("已加入「"+t.name+"」的動作");
    }));
    s.appendChild(mk("換成「"+t.name+"」","清掉目前已輸入的內容，重新開始","crit",()=>{
      if(confirm("確定清掉目前已輸入的內容，換成「"+t.name+"」？")) setTemplate(t); else renderLog();
    }));

function excCard(x,xi){
  const c=el("div",{class:"exc"});
  const h=el("div",{class:"h"});
  h.appendChild(el("b",null,x.name));
  h.appendChild(el("span",{class:"tag"},PARTS[x.part]?PARTS[x.part].n:""));
  const tut=el("button",{class:"tut"},"▶ 看教學");
  tut.addEventListener("click",()=>openTutorial(x.name,"log"));
  h.appendChild(tut);
  c.appendChild(h);

  const info=exInfo(x.name);
  if(info&&info.cue) c.appendChild(el("div",{class:"cue"},info.cue));

  const prev=lastSetsFor(x.name);
  x.sets.forEach((s,si)=>{
    const r=el("div",{class:"set"});
    r.appendChild(el("span",{class:"no"},String(si+1)));
    const w=el("button",{class:"w"+(KP.ex===xi&&KP.set===si&&KP.f==="w"?" sel":"")}, s.w===""?"—":String(s.w));
    w.addEventListener("click",()=>selectCell(xi,si,"w"));
    r.appendChild(w);
    r.appendChild(el("span",{class:"x"},"kg ×"));
    const rp=el("button",{class:"r"+(KP.ex===xi&&KP.set===si&&KP.f==="reps"?" sel":"")}, s.reps===""?"—":String(s.reps));
    rp.addEventListener("click",()=>selectCell(xi,si,"reps"));
    r.appendChild(rp);
    const ls=prev&&prev.sets[si];
    r.appendChild(el("span",{class:"last"},ls?"上次\n"+ls.w+"×"+ls.reps:""));
    const ok=el("button",{class:"ok","aria-pressed":String(!!s.done)},"✓");
    ok.addEventListener("click",()=>{ s.done=!s.done; s.t=true;
      if(s.done&&s.w!==""&&s.reps!=="") nextCell(); renderLog(); });
    r.appendChild(ok);
    c.appendChild(r);
  });

  const f=el("div",{class:"f"});
  const add=el("button",{class:"btn sm"},"＋ 新增一組");
  add.addEventListener("click",()=>{ const l=x.sets[x.sets.length-1]||{w:"",reps:""};
    x.sets.push({w:l.w,reps:"",done:false}); renderLog(); });
  f.appendChild(add);
  if(prev){
    const same=el("button",{class:"btn sm pri"},"全部同上次");
    same.addEventListener("click",()=>{
      x.sets=prev.sets.map(s=>({w:s.w,reps:s.reps,done:true,t:true}));
      renderLog(); toast("已套用上次的 "+prev.sets.length+" 組");
    });
    f.appendChild(same);
  }
  const del=el("button",{class:"btn sm dim"},"移除");
  del.addEventListener("click",()=>{ if(confirm("移除 "+x.name+"？")){ L.exercises.splice(xi,1); KP.ex=-1; renderLog(); } });
  f.appendChild(del);
  f.appendChild(el("span",{class:"vol"}, fmt(exVol(x))+" kg·次"));
  c.appendChild(f);
  return c;
}
function openExercisePicker(){
  openSheet(s=>{
    s.appendChild(el("h2",null,"加入動作"));
    let part="chest";
    const pg=el("div",{class:"pgrid",style:"margin:14px 0 10px"});
    const list=el("div");
    const draw=()=>{
      $$("button",pg).forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.p===part)));
      list.innerHTML="";
      const names=(EX[part]||[]).map(x=>x.n).concat(DB.customExercises[part]||[]);
      names.forEach(n=>{
        const b=el("button",{class:"rowcard"});
        const t=el("div",{class:"t"}); t.appendChild(el("b",null,n));

        b.appendChild(t);
        const lp=lastSetsFor(n);

        b.addEventListener("click",()=>{ closeSheet(); addExercise(n); });
        list.appendChild(b);
      });
    };

      const b=el("button",{"data-p":p});

    });
    s.appendChild(pg); s.appendChild(list);
    draw();
  });
}

function saveLog(){
  if(!L) return;
  let data={};
  if(L.sport==="strength"){
    data.template=L.template||"";
    // 只存真的有次數的組（避免課表自動帶入的重量被當成做過）
    data.exercises=L.exercises.map(x=>({name:x.name,part:x.part,
      sets:x.sets.filter(s=>s.reps!=="" && num(s.reps)>0).map(s=>({w:num(s.w),reps:num(s.reps)}))})).filter(x=>x.sets.length);
    if(!data.exercises.length){ toast("請至少填一組的次數"); return; }
  } else {
    const chk=beforeSaveExt(L);        // HYROX / 間歇 / 混合健身的檢查與整理（M2）
    if(chk===false) return;
    data=JSON.parse(JSON.stringify(L.data||{}));
    if(!L.duration && !Object.keys(data).length){ toast("請至少填寫時長"); return; }
  }
  const e={ id:Date.now()+"-"+Math.random().toString(36).slice(2,7), sport:L.sport, date:L.date,
    duration:num(L.duration), rpe:L.rpe===""?null:num(L.rpe), note:L.note||"",
    data, createdAt:new Date().toISOString() };
  DB.entries.push(e); DB.draft=null; L=null;
  stopRest(); save();
  toast("已儲存 "+mdw(e.date)+" " + SPORTS[e.sport].n);
  go("home");
}

/* ============================================================
   數字鍵盤
   ============================================================ */
let KP={ex:-1,set:-1,f:"w",buf:null};
let rest={t:null,left:0};
function selectCell(xi,si,f){
  KP={ex:xi,set:si,f:f,buf:null};
  renderLog(); openPad(); scrollToCell();
}
function scrollToCell(){
  setTimeout(()=>{
    const c=$("#v-log .set .sel");
    if(c) c.closest(".set").scrollIntoView({block:"center",behavior:"smooth"});
  },60);
}
// ±2.5 的基準：目前格 → 同動作上一組 → 上次紀錄 → 0
function seedValue(x,si,f){
  const s=x.sets[si];
  if(s[f]!=="") return num(s[f]);
  for(let i=si-1;i>=0;i--) if(x.sets[i][f]!=="") return num(x.sets[i][f]);
  const prev=lastSetsFor(x.name);
  if(prev){ const ls=prev.sets[si]||prev.sets[prev.sets.length-1]; if(ls&&ls[f]!=null) return num(ls[f]); }
  return 0;
}
function nextCell(){
  if(KP.ex<0) return;
  const x=L.exercises[KP.ex];
  if(KP.f==="w"){ KP.f="reps"; }
  else if(KP.set < x.sets.length-1){ KP.set++; KP.f="w"; }
  else if(KP.ex < L.exercises.length-1){ KP.ex++; KP.set=0; KP.f="w"; }
  KP.buf=null;
}
function cur(){ return (KP.ex>=0 && L && L.exercises[KP.ex]) ? L.exercises[KP.ex].sets[KP.set] : null; }
function openPad(){ $("#pad").hidden=false; $(".shell").classList.add("padopen");
  requestAnimationFrame(()=>$("#pad").classList.add("on")); renderPad(); }
function closePad(){ const p=$("#pad"); p.classList.remove("on"); setTimeout(()=>p.hidden=true,200);
  $(".shell").classList.remove("padopen"); KP.ex=-1; }
function renderPad(){
  const p=$("#pad"); if(p.hidden) return;
  const x=L&&L.exercises[KP.ex]; if(!x){ closePad(); return; }
  p.innerHTML="";
  const st=el("div",{class:"st"});
  st.appendChild(el("span",null,"正在輸入"));
  st.appendChild(el("b",null,x.name+" · 第 "+(KP.set+1)+" 組 · "+(KP.f==="w"?"重量":"次數")));
  const rb=el("button",{class:"btn sm rest"}, rest.t?("⏱ 休息 "+mmss(rest.left)):"⏱ 休息");
  rb.addEventListener("click",()=> rest.t?stopRest():startRest(90));
  st.appendChild(rb);
  const close=el("button",{class:"btn sm",title:"收起鍵盤",style:"margin-left:6px"},"✕ 收起");
  close.addEventListener("click",()=>{ closePad(); renderLog(); });
  st.appendChild(close);
  p.appendChild(st);

  const keys=el("div",{class:"keys"});
  const prev=lastSetsFor(x.name);
  const layout=[["1"],["2"],["3"],["同上次","alt"],["4"],["5"],["6"],["−2.5","alt"],
                ["7"],["8"],["9"],["+2.5","alt"],[".",""],["0"],["⌫",""],["下一組","go"]];
  layout.forEach(([k,cls])=>{
    const b=el("button",{class:cls||""},k);
    b.addEventListener("click",()=>padKey(k,prev));
    keys.appendChild(b);
  });
  p.appendChild(keys);
}
function padKey(k,prev){
  const s=cur(); if(!s) return;
  const field=KP.f;
  if(k!=="下一組") s.t=true;   // 使用者動過這一組
  const curv=String(s[field]===""?"":s[field]);
  if(/^[0-9.]$/.test(k)){
    const base = KP.buf==null ? "" : curv;
    const nv = (base+k);
    if(k==="." && base.includes(".")) return;
    s[field]=nv; KP.buf="typing";
  } else if(k==="⌫"){
    const nv=curv.slice(0,-1); s[field]=nv; KP.buf="typing";
  } else if(k==="同上次"){
    const ls=prev&&prev.sets[KP.set];
    if(ls){ s.w=ls.w; s.reps=ls.reps; toast("已套用上次 "+ls.w+"×"+ls.reps); }
    else toast("這個動作還沒有上次紀錄");
    KP.buf=null;
  } else if(k==="−2.5"||k==="+2.5"){
    const d=k==="+2.5"?2.5:-2.5;
    const base=seedValue(L.exercises[KP.ex],KP.set,field);
    s[field]=Math.max(0, Math.round((base+d)*100)/100);
    KP.buf=null;
  } else if(k==="下一組"){
    if(s.w!==""&&s.reps!=="") s.done=true;
    nextCell();
    if(rest.t==null && s.done) startRest(90);
    renderLog(); renderPad(); scrollToCell(); return;
  }
  renderLog(); renderPad();
}
function startRest(sec){
  stopRest(); rest.left=sec;
  rest.t=setInterval(()=>{
    rest.left--;
    if(rest.left<=0){ stopRest(); toast("休息結束"); }
    renderPad();
  },1000);
  renderPad();
}
function stopRest(){ if(rest.t){ clearInterval(rest.t); rest.t=null; } rest.left=0; }

  const parts=Object.keys(pv).map(p=>({k:PARTS[p]?PARTS[p].n:p,v:pv[p]})).sort((a,b)=>b.v-a.v);

      r.appendChild(el("span",{class:"u"},"kg × "+b.r+" · "+md(b.date)));
      v.appendChild(r);
    });
  }
  renderHyroxStats(v);               // HYROX 站點進步（M2）
}

<script>
"use strict";
/* ============================================================
   M2：HYROX · 高強度間歇 · 混合健身 · 賽事 · 週報
   ============================================================ */

/* ---------- 時間輸入 ----------
   接受 "4:32"、"432"（=4:32）、"1:23:22"、"12322"（=1:23:22）、"5"（=5:00） */
function parseTime(s){
  s=String(s==null?"":s).trim(); if(!s) return 0;
  if(s.includes(":")){
    const p=s.split(":").map(x=>parseInt(x,10)||0);
    return p.length>=3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+(p[1]||0);
  }
  const d=s.replace(/\D/g,""); if(!d) return 0;
  if(d.length<=2) return parseInt(d,10)*60;
  if(d.length<=4) return parseInt(d.slice(0,-2),10)*60+parseInt(d.slice(-2),10);
  return parseInt(d.slice(0,-4),10)*3600+parseInt(d.slice(-4,-2),10)*60+parseInt(d.slice(-2),10);
}
function fmtT(sec){
  sec=Math.round(num(sec)); if(!sec) return "";
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? h+":"+pad2(m)+":"+pad2(s) : m+":"+pad2(s);
}
function timeInput(sec,on,ph,cls){
  const i=el("input",{type:"text",inputmode:"numeric",autocomplete:"off",placeholder:ph||"4:32",class:"tin "+(cls||"")});
  if(sec) i.value=fmtT(sec);
  i.addEventListener("change",()=>{ const v=parseTime(i.value); i.value=v?fmtT(v):""; on(v); });
  i.addEventListener("focus",()=>{ try{ i.select(); }catch(e){} });
  return i;
}
function stepper(val,on,min,max,step,unit){
  const w=el("div",{class:"stepper"});
  const minus=el("button",{type:"button","aria-label":"減少"},"−");
  const v=el("span",{class:"v"},String(val));
  const plus=el("button",{type:"button","aria-label":"增加"},"＋");
  const set=n=>{ n=Math.max(min,Math.min(max,n)); v.textContent=String(n); on(n); };
  minus.addEventListener("click",()=>set(num(v.textContent)-(step||1)));
  plus.addEventListener("click",()=>set(num(v.textContent)+(step||1)));
  w.append(minus,v,plus);
  if(unit) w.appendChild(el("span",{class:"u"},unit));
  return w;
}
function segCtl(opts,val,on,style){
  const seg=el("div",{class:"seg",style:style||""});
  opts.forEach(([k,n])=>{
    const b=el("button",{type:"button","aria-pressed":String(val===k)},n);
    b.addEventListener("click",()=>on(k));
    seg.appendChild(b);
  });
  return seg;
}
function setDuration(mins){
  if(!L) return;
  L.duration=String(mins);
  const di=$("#f-duration"); if(di) di.value=L.duration;
}

/* ============================================================
   HYROX
   ============================================================ */
const HX_ALL=[HX_RUN].concat(HX_ST);
function hxItem(k){ return HX_ALL.find(x=>x.k===k)||null; }
function gLabel(g){ return g==="混合" ? "混合" : (g||"男")+"子"; }
function hxDefaults(d){
  if(!d.mode) d.mode="full";
  if(!d.div) d.div="Open";
  if(!d.g) d.g="男";
  if(!Array.isArray(d.runs)) d.runs=[0,0,0,0,0,0,0,0];
  if(!Array.isArray(d.st)) d.st=[0,0,0,0,0,0,0,0];
  if(d.rox==null) d.rox=0;
  if(d.manualTotal==null) d.manualTotal=0;
  if(!Array.isArray(d.items)) d.items=["run","ski","push"];
  if(!d.combo) d.combo="circuit";
  if(!d.rounds) d.rounds=3;
  if(!d.blocks||typeof d.blocks!=="object") d.blocks={};
  if(d.total==null) d.total=0;
}
function hxSplits(d){
  const runs=(d.runs||[]).reduce((a,b)=>a+num(b),0), st=(d.st||[]).reduce((a,b)=>a+num(b),0);
  return {runs, st, rox:num(d.rox), sum:runs+st+num(d.rox)};
}
function hxTotal(d){ const s=hxSplits(d); return s.sum||num(d.manualTotal); }

function renderHyrox(box,d){
  hxDefaults(d);
  box.appendChild(segCtl([["full","完整模擬"],["station","站點訓練"]],d.mode,
    k=>{ d.mode=k; renderLog(); },"margin:4px 0 14px"));

/* 6a：站點訓練（單項或複選，各自分開 / 循環 × N） */
function hxStation(box,d){
  box.appendChild(el("div",{class:"lab",style:"margin-top:4px"},"選擇項目 · 可複選"));

      if(on){
        if(hxHasData(d,it.k) && !confirm("「"+it.n+"」已經填了資料，確定取消這個項目？")) return;
        d.items=d.items.filter(x=>x!==it.k);
      } else {
        d.items=HX_ALL.map(x=>x.k).filter(k=>k===it.k||d.items.includes(k));   // 維持固定順序
      }
      renderLog();
    });
    g.appendChild(b);
  });
  box.appendChild(g);

  const cr=el("div",{class:"hxcombo"});
  cr.appendChild(el("span",{class:"k"},"組合方式"));
  cr.appendChild(segCtl([["separate","各自分開"],["circuit","循環 × "+d.rounds]],d.combo,
    k=>{ d.combo=k; hxEnsureSets(d); renderLog(); }));
  if(d.combo==="circuit")
    cr.appendChild(stepper(d.rounds,n=>{ d.rounds=n; hxEnsureSets(d); renderLog(); },1,10,1,"輪"));

    h.appendChild(el("b",null,it.n));
    const sub = k==="run" ? (d.combo==="circuit"&&stations.length?"站後接跑":"時間")
              : (it.wi!=null ? "距離 · 自填重量" : (it.unit==="次"?"次數":"距離"));

      const r=el("div",{class:"set hxset"});
      r.appendChild(el("span",{class:"no"},String(i+1)));

        r.appendChild(timeInput(s.t,v=>{ s.t=v; hxStPaint(d); },"4:30","big"));
        if(d.combo==="circuit"&&stations.length)
          r.appendChild(el("span",{class:"x"},"接"+hxItem(stations[i%stations.length]).n));
      } else {
        const di=el("input",{type:"number",inputmode:"decimal",class:"nin",
          placeholder:String(it.unit==="次"?Math.min(it.dist,50):Math.min(it.dist,500))});
        if(s.d) di.value=s.d;
        di.addEventListener("change",()=>{ s.d=di.value; });
        r.appendChild(di);
        r.appendChild(el("span",{class:"x"},it.unit));
        if(it.wi!=null){
          const wi=el("input",{type:"number",inputmode:"decimal",class:"nin",placeholder:"kg"});
          if(s.kg) wi.value=s.kg;
          wi.addEventListener("change",()=>{ s.kg=wi.value; });
          r.appendChild(wi);
          r.appendChild(el("span",{class:"x"},"kg"));
        }
        r.appendChild(timeInput(s.t,v=>{ s.t=v; },"2:00","r"));
      }
      const del=el("button",{class:"ok",title:"刪除這組"},"✕");
      del.addEventListener("click",()=>{ sets.splice(i,1); renderLog(); });
      r.appendChild(del);
      c.appendChild(r);
    });
    const f=el("div",{class:"f"});
    const add=el("button",{class:"btn sm"},"＋ 新增一組");
    add.addEventListener("click",()=>{ const l=sets[sets.length-1]||{}; sets.push({d:l.d||"",kg:l.kg||"",t:0}); renderLog(); });
    f.appendChild(add);
    c.appendChild(f);
    box.appendChild(c);
  });

  const tg=el("div",{class:"fgrid",style:"margin-top:6px"});
  const tf=el("div",{class:"field"});
  tf.appendChild(el("label",null,"總時間"));
  tf.appendChild(timeInput(d.total,v=>{ d.total=v; if(v) setDuration(Math.max(1,Math.round(v/60))); },"31:18"));
  tg.appendChild(tf);
  tg.appendChild(fieldInput("平均心率","number",d.hr||"",x=>d.hr=x,"163"));
  box.appendChild(tg);
  box.appendChild(el("div",{class:"sub",id:"hx-cmp",style:"margin:-2px 0 6px"}));
  setTimeout(()=>hxStPaint(d),0);
}
function hxEnsureSets(d){
  d.items.forEach(k=>{
    if(!Array.isArray(d.blocks[k])) d.blocks[k]=[];
    const want = d.combo==="circuit" ? d.rounds : Math.max(1,d.blocks[k].length);
    while(d.blocks[k].length<want) d.blocks[k].push({d:"",kg:"",t:0});
    if(d.combo==="circuit"){
      while(d.blocks[k].length>want){
        const l=d.blocks[k][d.blocks[k].length-1];
        if(l.t||l.d||l.kg) break;               // 有資料的組不自動刪
        d.blocks[k].pop();
      }
    }
  });
}
function hxHasData(d,k){ return (d.blocks[k]||[]).some(s=>s.t||s.d||s.kg); }
function hxRunAvg(d){
  const t=((d.blocks&&d.blocks.run)||[]).map(s=>num(s.t)).filter(Boolean);
  return t.length ? t.reduce((a,b)=>a+b,0)/t.length : 0;
}
function hxStPaint(d){
  const c=$("#hx-cmp"); if(!c) return;
  const key=d.items.slice().sort().join(",");
  const last=DB.entries.filter(e=>e.sport==="hyrox"&&e.data&&e.data.mode==="station"&&
      (e.data.items||[]).slice().sort().join(",")===key&&e.date<=L.date)
    .sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!last){ c.textContent=""; return; }
  const lp=hxRunAvg(last.data), np=hxRunAvg(d);
  let s="上次同組合 "+md(last.date);
  if(lp) s+="：站後跑平均 "+fmtT(lp)+" /km";
  if(lp&&np){
    const diff=Math.round(lp-np);
    s+= diff>0 ? "　本次快 "+diff+" 秒" : diff<0 ? "　本次慢 "+(-diff)+" 秒" : "　與上次相同";
  }
  c.textContent=s;
}

function renderHiit(box,d){
  if(!d.form) d.form = d.name&&/tabata/i.test(d.name) ? "Tabata" : "Tabata";
  const pr=HIIT_FORMS[d.form];
  if(d.rounds==null||d.rounds==="") d.rounds=pr?pr.rounds:8;
  if(d.work==null||d.work==="") d.work=pr?pr.work:20;
  if(d.rest==null||d.rest==="") d.rest=pr?pr.rest:10;
  if(!Array.isArray(d.moves))
    d.moves = (typeof d.moves==="string"&&d.moves) ? d.moves.split(/[\/、,，]/).map(x=>({n:x.trim()})).filter(x=>x.n) : [];

  box.appendChild(el("div",{class:"sub",style:"margin:-2px 0 12px",id:"hiit-sum"},hiitSummary(d)));

  Object.keys(HIIT_FORMS).forEach(f=>{
    const b=el("button",{class:"chip","aria-pressed":String(d.form===f)},f);

      d.form=f; const p=HIIT_FORMS[f];
      if(p){ d.rounds=p.rounds; d.work=p.work; d.rest=p.rest; }
      renderLog();
    });
    c.appendChild(b);
  });

  const g=el("div",{class:"hiitg"});
  [["回合","rounds",1,60,1,""],["作功","work",5,600,5,"秒"],["休息","rest",0,600,5,"秒"]].forEach(([lab,k,mn,mx,st,u])=>{
    const f=el("div",{class:"field"});
    f.appendChild(el("label",null,lab));
    f.appendChild(stepper(num(d[k]),n=>{
      d[k]=n;
      const s=$("#hiit-sum"); if(s) s.textContent=hiitSummary(d);
      hiitRoundsPaint(d);
    },mn,mx,st,u));
    g.appendChild(f);
  });
  box.appendChild(g);

  box.appendChild(el("div",{class:"lab"},"動作"));

  box.appendChild(add);

  box.appendChild(el("div",{class:"fgrid",style:"margin-top:12px"})).append(
    fieldInput("平均心率","number",d.hr||"",x=>d.hr=x,"168"));
  const last=DB.entries.filter(e=>e.sport==="hiit"&&e.data&&e.data.form===d.form&&e.date<=L.date)
    .sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(last) box.appendChild(el("div",{class:"sub",style:"margin-top:-2px"},
    "上次 "+d.form+"："+md(last.date)+" · "+(last.data.rounds||"?")+" 回合"+(last.rpe?" · RPE "+last.rpe:"")));
}
function hiitSummary(d){
  const t=num(d.rounds)*(num(d.work)+num(d.rest));      // 作功＋休息，例如 Tabata 8 × 30 秒 = 4 分鐘
  return d.form+" · "+num(d.rounds)+" 回合 · "+num(d.work)+"″/"+num(d.rest)+"″ · 共 "+(t>=60 ? fmt(t/60)+" 分鐘" : t+" 秒");
}
function hiitRoundLabel(d,i){
  const n=d.moves.length, R=num(d.rounds); if(!n||!R) return "";
  const rs=[]; for(let r=1;r<=R;r++) if((r-1)%n===i) rs.push(r);

}

function movePicker(onPick,startPart){
  openSheet(s=>{
    s.appendChild(el("h2",null,"加入動作"));

      if(q){
        const ql=q.toLowerCase();
        names=Object.values(EX_INDEX).filter(x=>(x.n+x.en).toLowerCase().includes(ql)).map(x=>x.n);
        Object.values(DB.customExercises).forEach(a=>(a||[]).forEach(n=>{ if(n.toLowerCase().includes(ql)) names.push(n); }));
        const own=el("button",{class:"rowcard"});
        const t=el("div",{class:"t"}); t.appendChild(el("b",null,"加入「"+q+"」")); t.appendChild(el("span",{class:"tag"},"自訂"));
        own.appendChild(t);
        own.addEventListener("click",()=>{ closeSheet(); onPick(q); });
        list.appendChild(own);
      } else names=(EX[part]||[]).map(x=>x.n).concat(DB.customExercises[part]||[]);
      names.forEach(n=>{
        const b=el("button",{class:"rowcard"});
        const t=el("div",{class:"t"}); t.appendChild(el("b",null,n));
        const i=exInfo(n); if(i) t.appendChild(el("span",{class:"tag"},i.en));
        b.appendChild(t);
        b.addEventListener("click",()=>{ closeSheet(); onPick(n); });
        list.appendChild(b);
      });
    };
    si.addEventListener("input",()=>{ q=si.value.trim(); draw(); });
    draw();
  });
}

/* ---------- 給核心模組用的掛勾 ---------- */
function describeExt(e){
  const d=e.data||{};
  if(e.sport==="hyrox"){
    if((d.mode||"full")==="full"){
      const dd=Object.assign({},d); hxDefaults(dd);
      return ["模擬賽", dd.div+" "+gLabel(dd.g), fmtT(hxTotal(dd)), d.hr?"心率 "+d.hr:""].filter(Boolean).join(" · ");
    }
    const names=(d.items||[]).map(k=>{ const it=hxItem(k); return it?it.n:k; }).join("、");
    return ["站點訓練", names, d.combo==="circuit"?"循環 × "+d.rounds:"各自分開",
      d.total?fmtT(d.total):(e.duration?e.duration+" 分":"")].filter(Boolean).join(" · ");
  }
  if(e.sport==="hiit" && d.form){
    return [d.form, d.rounds?d.rounds+" 回合":"", (d.work!=null&&d.rest!=null)?d.work+"″/"+d.rest+"″":"",
      Array.isArray(d.moves)&&d.moves.length?d.moves.map(m=>m.n).join("、"):"", d.hr?"心率 "+d.hr:""].filter(Boolean).join(" · ");
  }
  if(e.sport==="crossfit" && Array.isArray(d.moves)){
    return [d.name||"", d.type||"", cfResult(d), d.scale||""].filter(Boolean).join(" · ");
  }
  return null;
}
function beforeSaveExt(Lg){
  const d=Lg.data||(Lg.data={});
  if(Lg.sport==="hyrox"){
    hxDefaults(d);
    if(d.mode==="full"){
      const t=hxTotal(d);
      if(!t){ toast("請至少填總時間，或其中一段分段"); return false; }
      if(!Lg.duration) Lg.duration=String(Math.max(1,Math.round(t/60)));
      ["items","blocks","combo","rounds","total"].forEach(k=>delete d[k]);
    } else {
      if(!d.items.length){ toast("請至少選一個項目"); return false; }
      Object.keys(d.blocks).forEach(k=>{
        if(!d.items.includes(k)) delete d.blocks[k];
        else d.blocks[k]=d.blocks[k].filter(s=>s.t||s.d||s.kg);
      });
      const any=Object.values(d.blocks).some(a=>a.length)||d.total;
      if(!any){ toast("請至少填一組時間或距離"); return false; }
      if(!Lg.duration && d.total) Lg.duration=String(Math.max(1,Math.round(d.total/60)));
      ["runs","st","rox","manualTotal","div","g"].forEach(k=>delete d[k]);
    }
    return true;
  }
  if(Lg.sport==="hiit"){
    d.moves=(d.moves||[]).filter(m=>m&&m.n);
    if(!Lg.duration) Lg.duration=String(Math.max(1,Math.round(num(d.rounds)*(num(d.work)+num(d.rest))/60)));
    return true;
  }
  if(Lg.sport==="crossfit"){
    d.moves=(d.moves||[]).filter(m=>m&&m.n);
    if(!Lg.duration && d.time) Lg.duration=String(Math.max(1,Math.round(d.time/60)));
    if(!d.name && !d.moves.length && !cfResult(d) && !Lg.duration){ toast("請填課表、動作或成績"); return false; }
    return true;
  }
  return true;
}
/* 這筆紀錄是否真的有內容（決定要不要問、要不要留草稿） */
function logHasContent(Lg){
  if(!Lg) return false;
  if(Lg.sport==="strength") return hasInput()||!!Lg.duration;
  if(Lg.duration||Lg.note) return true;
  const d=Lg.data||{};
  if(Lg.sport==="hyrox"){
    if((d.runs||[]).some(Boolean)||(d.st||[]).some(Boolean)||d.rox||d.manualTotal||d.total||d.hr) return true;
    return Object.values(d.blocks||{}).some(a=>(a||[]).some(s=>s.t||s.d||s.kg));
  }
  if(Lg.sport==="hiit") return (d.moves||[]).length>0||!!d.hr;
  if(Lg.sport==="crossfit") return (d.moves||[]).length>0||!!d.name||!!d.time||!!d.result||!!d.rounds;
  return Object.keys(d).some(k=>d[k]!==""&&d[k]!=null);
}

/* ============================================================
   賽事（5f / 5g）
   公開賽事行事曆的自動抓取需要後端排程（M3），這裡先做手動加入
   ============================================================ */
const RACE_TYPES=["路跑","越野跑","鐵人兩項","鐵人三項","健身・HYROX","自行車","游泳","其他"];
let raceFilter="全部";
function daysUntil(ds){
  const a=new Date(today()+"T00:00:00"), b=new Date(ds+"T00:00:00");
  return Math.round((b-a)/864e5);
}
function upcomingRaces(){
  const t=today();
  return (DB.races||[]).filter(r=>r.date>=t).sort((a,b)=>a.date.localeCompare(b.date));
}
function raceStatus(r){
  if(r.registered) return {t:"已報名"+(r.division?" · "+r.division:""), cls:"ok"};
  if(!r.deadline) return {t:"尚未報名", cls:""};
  const d=daysUntil(r.deadline);
  if(d<0) return {t:"報名已截止 "+md(r.deadline), cls:"dim"};
  if(d<=7) return {t:"即將截止 "+md(r.deadline), cls:"crit"};
  return {t:"報名中 · 截止 "+md(r.deadline), cls:"acc"};
}
function renderRaces(){
  const v=$("#v-races"); v.innerHTML="";
  const head=el("div",{style:"display:flex;align-items:center;margin:8px 0 2px"});
  head.appendChild(el("h1",{style:"font-size:26px;margin:0"},"賽事"));
  const add=el("button",{class:"btn sm pri",style:"margin-left:auto"},"＋ 新增賽事");
  add.addEventListener("click",()=>raceForm(null));
  head.appendChild(add);
  v.appendChild(head);
  v.appendChild(el("div",{class:"sub",style:"margin:2px 0 12px"},"加入要參加的賽事，比賽日與報名截止可以一鍵放進 Google 行事曆。"));

  const all=DB.races||[];
  const types=["全部"].concat(RACE_TYPES.filter(t=>all.some(r=>r.type===t)));
  if(types.length>2){
    const c=el("div",{class:"chips",style:"margin-bottom:6px"});
    types.forEach(t=>{
      const b=el("button",{class:"chip","aria-pressed":String(raceFilter===t)},t);
      b.addEventListener("click",()=>{ raceFilter=t; renderRaces(); });
      c.appendChild(b);
    });
    v.appendChild(c);
  }
  const pick=r=> raceFilter==="全部"||r.type===raceFilter;
  const up=upcomingRaces().filter(pick);
  const mine=up.filter(r=>r.registered), others=up.filter(r=>!r.registered);

  v.appendChild(el("div",{class:"lab"},"我的賽事"));
  if(mine.length) mine.forEach(r=>v.appendChild(raceCard(r,true)));
  else v.appendChild(el("div",{class:"sub",style:"margin:0 0 6px"},"還沒有已報名的賽事。報名完成後在賽事詳情按「我已報名」。"));

  if(others.length){
    v.appendChild(el("div",{class:"lab"},"關注中"));
    others.forEach(r=>v.appendChild(raceCard(r,false)));
  }
  if(!all.length){
    const e=el("div",{class:"empty",style:"margin-top:8px"});
    e.appendChild(el("b",null,"還沒有賽事"));
    e.appendChild(el("span",null,"按右上角「＋ 新增賽事」，或從下方連結找賽事"));
    v.appendChild(e);
  }
  const past=(DB.races||[]).filter(r=>r.date<today()&&pick(r)).sort((a,b)=>b.date.localeCompare(a.date));
  if(past.length){
    v.appendChild(el("div",{class:"lab"},"已結束"));
    past.slice(0,6).forEach(r=>v.appendChild(raceCard(r,false,true)));
  }

  renderPublicRaces(v);              // 每週自動更新的公開賽事（M3）
}

/* ============================================================
   公開賽事行事曆（M3）
   GitHub Actions 每週一抓三個網站、去除重複後寫成 data/races.json
   ============================================================ */
const RACES_URL=(APP.beta?"../":"")+"data/races.json";
const PUB_SRC={ctrun:"全統運動報名網",sportsnet:"中華民國路跑協會",biji:"運動筆記"};
const PUB_REGIONS=["全台","北部","中部","南部","東部","離島","海外"];
const PUB_RANGE=[["1","未來 1 個月"],["3","未來 3 個月"],["6","未來 6 個月"],["12","未來 1 年"]];
const PUB={state:"idle",data:null,err:"",type:"全部",region:"全台",range:"6",open:false,limit:40};
function loadPublicRaces(){
  if(PUB.state==="loading"||PUB.state==="ok") return;
  PUB.state="loading";
  fetch(RACES_URL,{cache:"no-cache"})
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{ if(!j||!Array.isArray(j.races)) throw new Error("格式不符"); PUB.data=j; PUB.state="ok"; })
    .catch(e=>{ PUB.err=String(e.message||e); PUB.state="err"; })
    .finally(()=>{ if(view==="races") renderRaces(); });
}
function pubStatus(r){
  if(r.status==="full") return {t:"已額滿",cls:"dim"};
  if(r.status==="closed") return {t:"報名已截止",cls:"dim"};
  if(r.status==="tbd") return {t:"報名時間未定",cls:""};
  if(r.status==="open"){
    if(r.deadline){ const d=daysUntil(r.deadline);
      if(d<0) return {t:"報名已截止",cls:"dim"};
      return {t:(d<=7?"即將截止 ":"報名中 · 截止 ")+md(r.deadline),cls:d<=7?"crit":"acc"}; }
    return {t:"報名中",cls:"acc"};
  }
  return {t:"",cls:""};
}
function pubFiltered(){
  const t=today(), until=new Date(); until.setMonth(until.getMonth()+num(PUB.range));
  const u=dstr(until);
  return (PUB.data.races||[]).filter(r=> r.date>=t && r.date<=u
    && (PUB.type==="全部"||r.type===PUB.type)
    && (PUB.region==="全台"?(r.region!=="海外"):r.region===PUB.region)
    && (!PUB.open || pubStatus(r).cls==="acc"||pubStatus(r).cls==="crit"));
}

function myRaceFor(r){ return (DB.races||[]).find(x=>x.ext===r.id)||null; }

  pubFallback(v);

function gcalLink(o){
  const ymd=s=>s.replace(/-/g,"");
  let dates;
  if(o.time){
    const st=new Date(o.date+"T"+o.time+":00"), en=new Date(st.getTime()+3*3600e3);
    const f=d=>dstr(d).replace(/-/g,"")+"T"+pad2(d.getHours())+pad2(d.getMinutes())+"00";
    dates=f(st)+"/"+f(en);
  } else {
    const n=new Date(o.date+"T00:00:00"); n.setDate(n.getDate()+1);
    dates=ymd(o.date)+"/"+ymd(dstr(n));
  }
  const p=new URLSearchParams({action:"TEMPLATE",text:o.title,dates,details:o.details||"",location:o.location||""});
  if(o.time){ try{ p.set("ctz",Intl.DateTimeFormat().resolvedOptions().timeZone); }catch(e){} }
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function icsText(r){
  const esc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
  const ymd=s=>s.replace(/-/g,"");
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Fitness Record//ZH-TW","CALSCALE:GREGORIAN"];
  raceEvents(r).forEach((e,i)=>{
    out.push("BEGIN:VEVENT","UID:"+r.id+"-"+i+"@fitness-record","DTSTAMP:"+now);
    if(e.time){
      const st=new Date(e.date+"T"+e.time+":00"), en=new Date(st.getTime()+3*3600e3);
      const f=d=>dstr(d).replace(/-/g,"")+"T"+pad2(d.getHours())+pad2(d.getMinutes())+"00";
      out.push("DTSTART:"+f(st),"DTEND:"+f(en));
    } else {
      const n=new Date(e.date+"T00:00:00"); n.setDate(n.getDate()+1);
      out.push("DTSTART;VALUE=DATE:"+ymd(e.date),"DTEND;VALUE=DATE:"+ymd(dstr(n)));
    }
    out.push("SUMMARY:"+esc(e.title));
    if(e.location) out.push("LOCATION:"+esc(e.location));
    if(e.details) out.push("DESCRIPTION:"+esc(e.details));
    out.push("END:VEVENT");
  });
  out.push("END:VCALENDAR");
  return out.join("\r\n");
}

/* ============================================================
   週報（5h）
   只用 App 內的資料：訓練負荷 = 時長 × RPE（session-RPE）
   心率區間、HRV、靜止心率、睡眠需要 Apple 健康，網頁讀不到
   ============================================================ */
const PAIN_KW=["痛","緊","酸","傷","不舒服","抽筋","腫","麻"];
let reportOff=null;
function weekLoad(ws){
  const a=dstr(ws), e=new Date(ws); e.setDate(e.getDate()+6); const b=dstr(e);
  const rows=DB.entries.filter(x=>x.date>=a&&x.date<=b);
  const load=rows.reduce((s,x)=>s+num(x.duration)*((x.rpe!=null&&x.rpe!=="")?num(x.rpe):5),0);
  return {a,b,rows,load};
}
function computeReport(off){
  const ws=weekStart(new Date()); ws.setDate(ws.getDate()-7*off);
  const cur=weekLoad(ws);
  const first=DB.entries.reduce((m,x)=>(!m||x.date<m)?x.date:m,"");
  const prev=[];
  for(let i=1;i<=4;i++){ const w=new Date(ws); w.setDate(w.getDate()-7*i); const wl=weekLoad(w); if(first && wl.b>=first) prev.push(wl); }
  const avg=prev.length ? prev.reduce((s,p)=>s+p.load,0)/prev.length : 0;
  const enough=prev.length>=2 && avg>0;
  const ratio=enough ? cur.load/avg : null;

  const highDays=[...new Set(cur.rows.filter(x=>num(x.rpe)>=8).map(x=>x.date))].sort();
  let streakHigh=0, run=0, pd=null;
  highDays.forEach(ds=>{
    run = (pd && (new Date(ds+"T00:00:00")-new Date(pd+"T00:00:00"))/864e5===1) ? run+1 : 1;
    streakHigh=Math.max(streakHigh,run); pd=ds;
  });
  const notes=cur.rows.filter(x=>x.note&&PAIN_KW.some(k=>x.note.includes(k)))
    .sort((a,b)=>a.date.localeCompare(b.date));
  const bySport={}; cur.rows.forEach(x=>bySport[x.sport]=(bySport[x.sport]||0)+1);
  const race=upcomingRaces().find(r=>r.registered)||upcomingRaces()[0]||null;

  let level, head;
  if(!cur.rows.length){ level="none"; head="這週沒有紀錄"; }
  else if(!enough){ level="new"; head="資料還不夠比較，再記錄幾週就會有負荷分析"; }
  else if(ratio>1.3){ level="high"; head=(streakHigh>=3||notes.length)?"負荷偏高，恢復跟不上":"負荷偏高，注意恢復"; }
  else if(ratio<0.8){ level="low"; head="負荷偏低，可以逐步加量"; }
  else { level="ok"; head="負荷適中，維持節奏"; }

  const tips=[];
  if(level==="high") tips.push(["總量","下週總量降 10–20%，至少安排 2 天輕鬆或休息"]);
  if(streakHigh>=3) tips.push(["強度","連續 "+streakHigh+" 天高強度（RPE ≥ 8），高強度日之間至少隔一天"]);
  if(notes.length) tips.push(["身體","備註提到不適 "+notes.length+" 次，訓練前多做該部位活動度；持續疼痛請就醫"]);
  if(level==="low") tips.push(["總量","可以逐步增加，每週增加不超過 10%"]);
  if(cur.rows.length && !bySport.strength) tips.push(["肌力","這週沒有重訓，可以安排 1–2 次全身肌力"]);
  if(race){ const dd=daysUntil(race.date); if(dd>=0&&dd<=14) tips.push(["賽前","距「"+race.name+"」"+dd+" 天：維持強度、降低總量，賽前兩天以休息為主"]); }
  if(!tips.length && cur.rows.length) tips.push(["維持","目前安排平衡，照計畫進行"]);
  return {ws:cur.a, we:cur.b, cur, avg, ratio, enough, highDays, streakHigh, notes, bySport, race, level, head, tips};
}
function renderReport(v){
  if(reportOff==null){ const last=computeReport(1); reportOff = last.cur.rows.length ? 1 : 0; }
  const R=computeReport(reportOff);
  const sw=el("div",{class:"rp-sub"});
  sw.appendChild(el("span",{class:"sub",style:"margin:0;align-self:center;flex:1"},md(R.ws)+" – "+md(R.we)));
  sw.appendChild(segCtl([[1,"上週"],[0,"本週"]],reportOff,k=>{ reportOff=k; renderStats(); }));
  v.appendChild(sw);
  v.appendChild(el("h2",{class:"rp-head lv-"+R.level},R.head));
  v.appendChild(el("div",{class:"sub",style:"margin:0 0 6px"},"資料：App 內的紀錄（時長 × RPE）＋ 你的備註"));

  if(!R.cur.rows.length){
    v.appendChild(el("div",{class:"empty",style:"margin-top:12px"},"這週還沒有紀錄。記錄時填上時長與 RPE，週報就能計算訓練負荷。"));
  } else {
    v.appendChild(el("div",{class:"lab"},"訓練負荷"));
    const c=el("div",{class:"card"});
    if(R.enough){
      c.appendChild(el("div",{class:"rp-ratio lv-"+R.level},(Math.round(R.ratio*100)/100).toFixed(2)+"×"));
      const g=el("div",{class:"gauge"});
      const band=el("i",{class:"band"}); band.style.left=(0.8/2*100)+"%"; band.style.width=((1.3-0.8)/2*100)+"%";
      const mk=el("b",{class:"mk"}); mk.style.left=Math.min(100,Math.max(0,R.ratio/2*100))+"%";
      g.append(band,mk); c.appendChild(g);
      c.appendChild(el("div",{class:"sub",style:"margin-top:8px"},
        (reportOff?"上週":"本週")+"負荷是前幾週平均的 "+(Math.round(R.ratio*100)/100)+" 倍，建議控制在 0.8–1.3 之間"));
    } else {
      c.appendChild(el("div",{class:"sub",style:"margin:0"},"需要至少兩週以上的紀錄，才能和過去比較。"));
    }
    c.appendChild(el("div",{class:"sub",style:"margin-top:6px;font-size:12px"},
      "負荷 "+Math.round(R.cur.load)+"（時長分鐘 × RPE；沒填 RPE 以 5 計）"+(R.enough?" · 前幾週平均 "+Math.round(R.avg):"")));
    v.appendChild(c);

    v.appendChild(el("div",{class:"lab"},"組成"));
    const ks=Object.keys(R.bySport).sort((a,b)=>R.bySport[b]-R.bySport[a]);
    const mx=Math.max(...ks.map(k=>R.bySport[k]),1);
    ks.forEach(k=>v.appendChild(hbar(SPORTS[k]?SPORTS[k].n:k,R.bySport[k]/mx,R.bySport[k]+" 次")));

    if(R.highDays.length||R.notes.length){
      v.appendChild(el("div",{class:"lab"},"注意事項"));
      if(R.highDays.length) v.appendChild(el("div",{class:"bul"},
        "高強度日（RPE ≥ 8）："+R.highDays.map(md).join("、")+(R.streakHigh>=3?"，連續 "+R.streakHigh+" 天":"")));
      R.notes.forEach(n=> v.appendChild(el("div",{class:"bul"},md(n.date)+" "+(SPORTS[n.sport]?SPORTS[n.sport].n:"")+"：「"+n.note.slice(0,40)+"」")));
    }
  }

  const race=R.race;
  const th=el("div",{class:"lab"},(reportOff?"這週":"下週")+"建議"+(race&&daysUntil(race.date)>=0?" · 距 "+race.name+" "+Math.ceil(daysUntil(race.date)/7)+" 週":""));
  v.appendChild(th);
  if(!R.tips.length) v.appendChild(el("div",{class:"sub"},"有紀錄之後才會產生建議"));
  R.tips.forEach(([k,t])=>{
    const r=el("div",{class:"tipr"});
    r.appendChild(el("span",{class:"k"},k));
    r.appendChild(el("span",{class:"t"},t));
    v.appendChild(r);
  });

  v.appendChild(el("div",{class:"lab"},"身體數據"));
  v.appendChild(el("div",{class:"risk"},
    "心率區間、HRV、靜止心率、睡眠要從 Apple 健康讀取，但 iOS 只開放給原生 App，網頁版讀不到，所以週報暫時不含這些。"));
  v.appendChild(el("div",{class:"sub",style:"margin:14px 0 4px;font-size:12px"},
    "建議僅供參考，不是醫療意見。身體不適請先休息或就醫。"));
}

function renderHyroxStats(v){
  const hx=DB.entries.filter(e=>e.sport==="hyrox"&&e.data);
  if(!hx.length) return;
  const full=hx.filter(e=>(e.data.mode||"full")==="full").sort((a,b)=>a.date.localeCompare(b.date));
  const st=hx.filter(e=>e.data.mode==="station").sort((a,b)=>b.date.localeCompare(a.date));
  v.appendChild(el("div",{class:"lab"},"HYROX"));
  if(full.length){
    const tots=full.map(e=>{ const d=Object.assign({},e.data); hxDefaults(d); return {e,d,t:hxTotal(d)}; }).filter(x=>x.t);
    const best=tots.reduce((m,x)=>(!m||x.t<m.t)?x:m,null);
    v.appendChild(el("div",{class:"sub",style:"margin:0 0 4px"},"模擬賽"));
    tots.slice(-6).reverse().forEach(x=>{
      const r=el("div",{class:"prrow"});

      r.appendChild(el("span",{class:"v"},fmtT(x.t)));
      r.appendChild(el("span",{class:"u"},x===best?"最佳":""));
      v.appendChild(r);
    });
    // 各站最佳分段
    const rowsBest=HX_ST.map((s,i)=>{
      let b=null;
      full.forEach(e=>{ const t=num((e.data.st||[])[i]); if(t&&(!b||t<b.t)) b={t,date:e.date}; });
      return {s,b};
    }).filter(x=>x.b);
    const runBest=(()=>{ let b=null; full.forEach(e=>(e.data.runs||[]).forEach(t=>{ t=num(t); if(t&&(!b||t<b.t)) b={t,date:e.date}; })); return b; })();
    if(rowsBest.length||runBest){
      v.appendChild(el("div",{class:"sub",style:"margin:14px 0 4px"},"各段最佳（模擬賽）"));
      if(runBest){
        const r=el("div",{class:"prrow"});
        r.appendChild(el("span",{class:"nm"},"1 km 跑"));
        r.appendChild(el("span",{class:"v"},fmtT(runBest.t)));
        r.appendChild(el("span",{class:"u"},md(runBest.date)));
        v.appendChild(r);
      }
      rowsBest.forEach(x=>{
        const r=el("div",{class:"prrow"});
        r.appendChild(el("span",{class:"nm"},x.s.n+" "+x.s.dist+" "+x.s.unit));
        r.appendChild(el("span",{class:"v"},fmtT(x.b.t)));
        r.appendChild(el("span",{class:"u"},md(x.b.date)));
        v.appendChild(r);
      });
    }
  }
  const withRun=st.filter(e=>hxRunAvg(e.data));
  if(withRun.length){
    v.appendChild(el("div",{class:"sub",style:"margin:14px 0 4px"},"站點訓練 · 站後跑平均配速"));
    withRun.slice(0,6).forEach(e=>{
      const r=el("div",{class:"prrow"});
      const names=(e.data.items||[]).filter(k=>k!=="run").map(k=>hxItem(k)?hxItem(k).n:k).join("、");
      r.appendChild(el("span",{class:"nm"},md(e.date)+" · "+(names||"純跑")));
      r.appendChild(el("span",{class:"v"},fmtT(hxRunAvg(e.data))));
      r.appendChild(el("span",{class:"u"},"/km"));
      v.appendChild(r);
    });
  }
}

   Google 登入 ＋ 雲端硬碟同步（appDataFolder）
