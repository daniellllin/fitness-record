const CONFIG = {
  // ★ 貼上 Google Cloud Console 的「OAuth 用戶端 ID」，使用者就不用自己輸入
  CLIENT_ID: "761362119915-n2diispa8qkascmancs1687snhsmc575.apps.googleusercontent.com"
};
const SCOPES="openid email profile https://www.googleapis.com/auth/drive.appdata";
const FILE_NAME = APP.beta ? "fitness-record-beta.json" : "fitness-record.json";

const Auth={ clientId:"", tokenClient:null, token:null, expiresAt:0, user:null, _res:null, _rej:null,
  // 測試版沒填時，沿用正式版在同一個網域存過的用戶端 ID
  storedId(){ try{ return localStorage.getItem(KEY+".clientId")||localStorage.getItem("fitnessRecord.v1.clientId")||""; }catch(e){ return ""; } },
  setId(v){ try{ localStorage.setItem(KEY+".clientId",v); }catch(e){} Auth.clientId=v; } };

function gisReady(){
  return new Promise((res,rej)=>{ let n=0;
    (function poll(){
      if(window.google&&google.accounts&&google.accounts.oauth2) return res();
      if(++n>100) return rej(new Error("無法載入 Google 登入元件，請檢查網路"));
      setTimeout(poll,100);
    })();
  });
}
function initTokenClient(){
  Auth.tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:Auth.clientId, scope:SCOPES,
    callback:(r)=>{
      if(r&&r.access_token){
        Auth.token=r.access_token;
        Auth.expiresAt=Date.now()+(parseInt(r.expires_in,10)||3600)*1000;
        if(Auth._res){ const f=Auth._res; Auth._res=Auth._rej=null; f(Auth.token); }
      } else if(Auth._rej){ const f=Auth._rej; Auth._res=Auth._rej=null; f(new Error("未取得授權")); }
    },
    error_callback:(e)=>{ if(Auth._rej){ const f=Auth._rej; Auth._res=Auth._rej=null;
      f(new Error(e&&e.type==="popup_closed"?"你關閉了登入視窗":"登入失敗，請再試一次")); } }
  });
}
function requestToken(prompt){
  return new Promise((res,rej)=>{
    if(Auth.token&&Date.now()<Auth.expiresAt-60000) return res(Auth.token);
    if(!Auth.tokenClient) return rej(new Error("尚未初始化 Google 登入"));
    Auth._res=res; Auth._rej=rej;
    try{ Auth.tokenClient.requestAccessToken({prompt:prompt||""}); }
    catch(e){ Auth._res=Auth._rej=null; rej(e); }
  });
}
async function driveFetch(url,opts,retry){
  const t=await requestToken();
  const o=Object.assign({},opts||{});
  o.headers=Object.assign({},o.headers||{},{Authorization:"Bearer "+t});
  const r=await fetch(url,o);
  if(r.status===401&&!retry){ Auth.token=null; Auth.expiresAt=0; return driveFetch(url,opts,true); }
  if(!r.ok) throw new Error("Drive API "+r.status+"："+(await r.text()).slice(0,140));
  return r;
}
const Cloud={
  fileId:null, lastSync:0, timer:null, busy:false, pending:false, unloading:false,
  badge(s){ const d=$("#sync-dot"); if(d) d.dataset.s=s; },
  async findFile(){
    const q=encodeURIComponent("name = '"+FILE_NAME+"' and trashed = false");
    const r=await driveFetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+q+
      "&fields=files(id,name,modifiedTime)&pageSize=10");
    const j=await r.json(); return (j.files&&j.files[0])||null;
  },
  async pull(){
    const f=await Cloud.findFile();
    if(!f){ Cloud.fileId=null; return null; }
    Cloud.fileId=f.id;
    const r=await driveFetch("https://www.googleapis.com/drive/v3/files/"+f.id+"?alt=media");
    try{ return normalize(JSON.parse(await r.text())); }catch(e){ return null; }
  },
  async push(){
    if(!Auth.user) return;
    if(Cloud.busy){ Cloud.pending=true; return; }
    Cloud.busy=true; Cloud.badge("saving");
    try{
      const body=JSON.stringify(DB);
      if(!Cloud.fileId){
        const f=await Cloud.findFile();
        if(f) Cloud.fileId=f.id;
        else{
          const r=await driveFetch("https://www.googleapis.com/drive/v3/files",{method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name:FILE_NAME,parents:["appDataFolder"],mimeType:"application/json"})});
          Cloud.fileId=(await r.json()).id;
        }
      }
      await driveFetch("https://www.googleapis.com/upload/drive/v3/files/"+Cloud.fileId+"?uploadType=media",
        {method:"PATCH",headers:{"Content-Type":"application/json"},body});
      Cloud.lastSync=Date.now(); Cloud.badge("ok");
    }catch(e){
      if(!Cloud.unloading){ Cloud.badge("err"); console.warn("同步失敗：",e.message); }
    }finally{
      Cloud.busy=false;
      if(Cloud.pending){ Cloud.pending=false; Cloud.push(); }
    }
  },
  schedulePush(){ if(!Auth.user) return; clearTimeout(Cloud.timer); Cloud.badge("saving");
    Cloud.timer=setTimeout(()=>Cloud.push(),1500); },
  flush(){ if(Auth.user){ clearTimeout(Cloud.timer); Cloud.push(); } },
  async syncNow(){
    Cloud.badge("saving");
    try{
      const remote=await Cloud.pull();
      if(remote){ DB=mergeDB(DB,remote); if(storageOK) try{localStorage.setItem(cacheKey,JSON.stringify(DB));}catch(e){} }
      await Cloud.push();
      applyTheme(); go(view);
      toast("同步完成，共 "+DB.entries.length+" 筆");
    }catch(e){ Cloud.badge("err"); toast("同步失敗："+e.message); }
  }
};
function mergeDB(local,remote){
  local=normalize(local); remote=normalize(remote);
  const out=normalize({});
  out.deleted=Object.assign({},remote.deleted,local.deleted);
  const map={};
  remote.entries.forEach(e=>{ if(e&&e.id) map[e.id]=e; });
  local.entries.forEach(e=>{ if(!e||!e.id) return;
    const r=map[e.id];
    if(!r||String(e.createdAt||"")>String(r.createdAt||"")) map[e.id]=e; });
  out.entries=Object.keys(map).map(k=>map[k]).filter(e=>!out.deleted[e.id]);
  const ce={};
  [remote.customExercises,local.customExercises].forEach(src=>{
    for(const k in src) ce[k]=[...new Set((ce[k]||[]).concat(src[k]||[]))]; });
  out.customExercises=ce;
  const tm={};                                   // 以名稱為識別，避免新舊 id 造成同名重複
  remote.templates.forEach(t=> tm[String(t.name||t.id)]=t);
  local.templates.forEach(t=> tm[String(t.name||t.id)]=t);
  out.templates=dedupeTemplates(Object.keys(tm).map(k=>tm[k]));
  out.tplSeed=Math.max(local.tplSeed||0, remote.tplSeed||0, TPL_SEED);
  const rm={};                                   // 賽事：以 id 合併，較新的修改優先
  remote.races.forEach(r=> rm[r.id]=r);
  local.races.forEach(r=>{ const o=rm[r.id]; if(!o||String(r.updatedAt||"")>=String(o.updatedAt||"")) rm[r.id]=r; });
  out.races=Object.keys(rm).map(k=>rm[k]).filter(r=>!out.deleted[r.id]);
  out.draft=local.draft||null;                 // 草稿屬於這台裝置
  out.theme=local.theme||remote.theme||"system";
  out.updatedAt=Math.max(local.updatedAt||0,remote.updatedAt||0);
  return out;
}

  });
  b.appendChild(i); b.appendChild(ok); host.appendChild(b);
}
$("#btn-signin").addEventListener("click",async()=>{
  try{
    if(!Auth.tokenClient){ await gisReady(); initTokenClient(); }
    await requestToken("");
    await afterSignIn();
  }catch(e){ toast(e.message||"登入失敗"); }
});
$("#sync-dot").addEventListener("click",()=>{ if($("#sync-dot").dataset.s==="err") Cloud.syncNow(); });
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){ if(L) stashDraftSoft(); Cloud.flush(); }
  else checkUpdate();
});
window.addEventListener("pagehide",()=>{ Cloud.unloading=true; });
window.addEventListener("beforeunload",()=>{ Cloud.unloading=true; if(L) stashDraftSoft(); });
function stashDraftSoft(){
  if(!L) return;
  const worth = logHasContent(L);
  if(worth){ DB.draft=L; if(storageOK) try{ localStorage.setItem(cacheKey,JSON.stringify(DB)); }catch(e){} }
}

/* ============================================================
   新版本偵測
   GitHub Pages 會快取 HTML 約 10 分鐘，瀏覽器也可能留著舊檔。
   這裡繞過快取讀一次伺服器上的檔案，比對版本號，不同就提示更新。
   ============================================================ */
let _lastUpdCheck=0;
async function checkUpdate(){
  if(location.protocol==="file:") return;
  if(Date.now()-_lastUpdCheck<60000) return;
  _lastUpdCheck=Date.now();
  try{
    const r=await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const m=(await r.text()).match(/ver:"([^"]+)"/);
    if(m && m[1]!==APP.ver) showUpdate(m[1]);
  }catch(e){}
}
function showUpdate(v){
  let b=$("#updbar");
  if(!b){
    b=el("button",{id:"updbar",class:"updbar",type:"button"});
    b.addEventListener("click",()=>{
      if(L) stashDraftSoft();
      Cloud.flush();
      setTimeout(()=>location.replace(location.pathname+"?v="+encodeURIComponent(b.dataset.v)),300);
    });
    document.body.appendChild(b);
  }
  b.dataset.v=v;
  b.textContent="有新版本 "+v+"（目前 "+APP.ver+"）· 點這裡更新";
}

/* ============================================================
   啟動
   ============================================================ */
(function init(){
  DB=normalize({}); applyTheme();
  $$(".appver").forEach(n=>n.textContent=APP.ver);
  setTimeout(checkUpdate,1200);
  try{
    const q=new URLSearchParams(location.search).get("client_id");
    if(q&&/\.apps\.googleusercontent\.com$/.test(q)){ Auth.setId(q); history.replaceState(null,"",location.pathname); }
  }catch(e){}
  Auth.clientId=CONFIG.CLIENT_ID||Auth.storedId();
  $("#top-date").textContent=mdw(today());
  renderGateSetup();
  if(Auth.clientId&&location.protocol!=="file:"){
    gisReady().then(()=>{
      initTokenClient();
      let last=""; try{ last=localStorage.getItem(KEY+".lastUser")||""; }catch(e){}
      if(last) requestToken("none").then(afterSignIn).catch(()=>{});
    }).catch(e=>toast(e.message));
  }
})();
</script>
